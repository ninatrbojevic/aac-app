<p-toast/>
<p-confirmDialog/>

<div class="events-page">

  <!-- HEADER -->
  <div class="page-header">
    <h1>Digitalizirani sadržaj</h1>

    @if (isAdmin()) {
      <button pButton label="Novi sadržaj" class="custom-btn" (click)="showDigitalContentCreateDialog()"></button>
    } @else {
      <button pButton label="Novi zahtjev" class="custom-btn" (click)="showRequestCreateDialog()"></button>
    }
  </div>

  <!-- SEARCH -->
  <div class="search-bar">
    <p-iconfield>
      <p-inputicon styleClass="pi pi-search" />
      <input pInputText [(ngModel)]="contentSearchQuery" placeholder="Pretraži po nazivu ili autoru..." />
    </p-iconfield>
  </div>

  <!-- GRID -->
  <div class="events-grid">
    <div class="event-card" *ngFor="let item of filteredDigitalContentItems">

      <div class="card-content">
        <h3><i [class]="vrstaIcon(item.type)"></i> {{ item.title }}</h3>
        <p class="meta">
          {{ item.createdAt | date:'d. MMMM yyyy.' : '' : 'hr' }}
          <span>|</span>
          {{ item.author }}
          <span>|</span>
          {{ item.type }}
        </p>
      </div>

      <div class="card-actions">
        <a [href]="item.url" target="_blank" pButton label="Otvori" class="custom-btn p-button-sm"></a>

        @if (isAdmin()) {
          <button pButton label="Uredi" class="p-button-secondary p-button-sm"
            (click)="openDigitalContentUpdateDialog(item)">
          </button>
          <button pButton label="Obriši" class="p-button-danger p-button-outlined p-button-sm"
            (click)="confirmDelete(item)">
          </button>
        }
      </div>

    </div>
  </div>
</div>

<!-- CREATE / EDIT DIALOG — DIGITAL REQUEST (korisnik) -->
@if(!isAdmin()){
  <p-dialog
    header="Novi zahtjev"
    [(visible)]="visibleDigitalContentRequestDialogForm"
    [modal]="true"
    [style]="{ width: '520px' }"
    [draggable]="false"
    class="event-dialog">

    <form [formGroup]="digitalContentRequestForm" (ngSubmit)="submitDigitalContentRequestForm()" class="dialog-form">

      <div class="field">
        <label>Naslov</label>
        <input pInputText formControlName="title"/>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Autor</label>
          <input pInputText formControlName="author"/>
        </div>

        <div class="field">
          <label>Invaliditet</label>
          <input pInputText formControlName="impairment"/>
        </div>
      </div>

      <div class="field">
        <label>Opis</label>
        <textarea pInputText formControlName="description"></textarea>
      </div>

      <div class="dialog-footer">
        <button pButton type="button" label="Odustani" class="p-button-secondary"
          (click)="visibleDigitalContentRequestDialogForm = false">
        </button>
        <button type="submit" pButton label="Kreiraj zahtjev"></button>
      </div>

    </form>
  </p-dialog>
}

<!-- CREATE / EDIT DIALOG — DIGITAL CONTENT (admin) -->
@if(isAdmin()){
  <p-dialog
    [header]="selectedDigitalContentItem ? 'Uredi sadržaj' : 'Novi sadržaj'"
    [(visible)]="visibleDigitalContentDialogForm"
    [modal]="true"
    [style]="{ width: '520px' }"
    [draggable]="false"
    class="event-dialog">

    <form [formGroup]="digitalContentForm" (ngSubmit)="submitDigitalContentForm()" class="dialog-form">

      <div class="field">
        <label>Naslov</label>
        <input pInputText formControlName="title"/>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Vrsta</label>
          <p-select
            formControlName="type"
            [options]="vrsteOptions"
            optionLabel="label"
            optionValue="value"
            placeholder="Odaberi vrstu">
          </p-select>
        </div>

        <div class="field">
          <label>Autor</label>
          <input pInputText formControlName="author"/>
        </div>
      </div>

      <div class="field">
        <label>URL</label>
        <input pInputText formControlName="url"/>
      </div>

      <div class="dialog-footer">
        <button pButton type="button" label="Odustani" class="p-button-secondary"
          (click)="visibleDigitalContentDialogForm = false">
        </button>
        <button pButton type="submit"
          [label]="selectedDigitalContentItem ? 'Spremi' : 'Kreiraj'">
        </button>
      </div>

    </form>
  </p-dialog>
}
