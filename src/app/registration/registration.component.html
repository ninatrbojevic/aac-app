<div class="reg-wrapper">
  <div class="reg-card">

    <div class="logo">
      <img src="images/aac_logo.png" alt="AAC logo" />
    </div>

    <h1 class="title">AAC SUSTAV</h1>
    <p class="subtitle">Registrirajte se za nastavak</p>

    <div class="form">

      <div class="row">
        <div class="field">
          <input type="text" [(ngModel)]="ime" placeholder="Ime" />
        </div>
        <div class="field">
          <input type="text" [(ngModel)]="prezime" placeholder="Prezime" />
        </div>
      </div>

      <div class="field">
        <select [(ngModel)]="uloga" name="uloga" [class.placeholder]="!uloga">
          <option value="" disabled selected>Odaberite ulogu</option>
          <option value="Student">Student</option>
          <option value="Gost">Gost</option>
          <option value="Profesor">Profesor</option>
        </select>
      </div>

      <div class="field">
        <input type="text" [(ngModel)]="fakultet" placeholder="Fakultet/Organizacija" />
      </div>

      <div class="field">
        <input type="email" [(ngModel)]="email" placeholder="Email adresa" />
      </div>

      <div class="field">
        <input type="email" [(ngModel)]="emailRepeat" placeholder="Ponovni unos emaila" />
      </div>

      <div class="field">
        <div class="password-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="lozinka" placeholder="Lozinka" />
          <button type="button" class="eye-btn" (click)="showPassword = !showPassword" tabindex="-1">
            @if (showPassword) {
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <div class="field">
        <div class="password-wrapper">
          <input [type]="showPasswordRepeat ? 'text' : 'password'" [(ngModel)]="lozinkaRepeat" placeholder="Ponovni unos lozinke" />
          <button type="button" class="eye-btn" (click)="showPasswordRepeat = !showPasswordRepeat" tabindex="-1">
            @if (showPasswordRepeat) {
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            }
          </button>
        </div>
      </div>

      @if (greska) {
        <p class="error-msg">{{ greska }}</p>
      }

      <button class="btn-reg" (click)="onRegistracija()">Registracija</button>

    </div>
  </div>
</div>
