<div class="login-wrapper">
  <div class="login-card">

    <div class="logo">
      <img src="images/aac_logo.png" alt="AAC logo"/>
    </div>

    <h1 class="title">AAC SUSTAV</h1>
    <p class="subtitle">Prijavite se za nastavak</p>

    <p class="register-text">
      Nemate račun? <a routerLink="/register">Registrirajte se</a>
    </p>

    <div class="form">
      <div class="field">
        <label>Email ili korisničko ime</label>
        <input
          type="text"
          [(ngModel)]="email"
          placeholder="email@email.com"
          (keydown.enter)="onLogin()"
        />
      </div>

      <div class="field">
        <label>Lozinka</label>
        <div class="password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="lozinka"
            placeholder="••••••••••••"
            (keydown.enter)="onLogin()"
          />
          <button type="button" class="eye-btn" (click)="showPassword = !showPassword" tabindex="-1">
            @if (showPassword) {
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            }
          </button>
        </div>
      </div>

      @if (greska) {
        <p class="greska">{{ greska }}</p>
      }
      <button class="btn-login" (click)="onLogin()">Prijava</button>
    </div>

  </div>
</div>
